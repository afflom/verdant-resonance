spec = "lexlean/project/1"
name = "prism-verdant-resonance"
language = "1.2"
module_prefix = "PrismVerdantResonance"
source_roots = ["src"]
entrypoints = ["src/VerdantResonance.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[limits]
max_file_bytes = 16777216
max_total_source_bytes = 134217728
max_primitive_atoms = 8000000
max_token_lattice_edges = 16000000
max_parse_states = 16000000
max_ir_nodes = 8000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 33554432
child_timeout_ms = 600000
